name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check out the exact codec revision
        uses: actions/checkout@v4
        with:
          repository: emuella/emuella-j2k
          ref: 75083930b6e533053b7f5c3c4dda7b4a2c0a0c38
          path: emuella-j2k

      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.55.0
          run-install: false

      - name: Create the build environment
        run: pixi init ci-env && cd ci-env && pixi add 'gdal=3.13.0' cmake ninja compilers rust

      - name: Build the codec C ABI
        working-directory: emuella-j2k
        run: ../ci-env/.pixi/envs/default/bin/cargo build --locked --release -p emuella-j2k-capi

      - name: Build, test and audit the installed module
        run: |
          export PATH="$PWD/ci-env/.pixi/envs/default/bin:$PATH"
          export EMUELLA_J2K_SOURCE_DIR="$PWD/emuella-j2k"
          export GDAL_CONFIG="$PWD/ci-env/.pixi/envs/default/bin/gdal-config"
          ./scripts/check.sh
