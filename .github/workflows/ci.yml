name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check out the exact codec revision
        uses: actions/checkout@v7
        with:
          repository: emuella/emuella-j2k
          ref: 553b941911e35863c1eed7f23be8a41e1c4caa84
          path: emuella-j2k

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.55.0
          run-install: false

      - name: Create the build environment
        run: pixi init ci-env && cd ci-env && pixi add 'gdal=3.13.0' cmake ninja compilers

      - name: Build the codec C ABI
        working-directory: emuella-j2k
        run: cargo build --locked --release -p emuella-j2k-capi

      - name: Build, test and audit the installed module
        run: |
          export PATH="$PWD/ci-env/.pixi/envs/default/bin:$PATH"
          export EMUELLA_J2K_SOURCE_DIR="$PWD/emuella-j2k"
          export GDAL_CONFIG="$PWD/ci-env/.pixi/envs/default/bin/gdal-config"
          ./scripts/check.sh
